# Music and sound hits the render may use. A track plays only when `approved: true`, and a `claimable: true`
# track (anything Content ID can claim, e.g. a game theme or meme song) only when the profile sets
# `music: {allow_claimable: true}`. `file` is relative to this folder; meme tracks the user approved go in
# local/ (gitignored, copied to each machine by hand).
#   kind: music | hit      mood (music): suspense | sneaky | epic | sad | funny
tracks:
  - {id: hit, file: hit.wav, kind: hit, mood: any, claimable: false, approved: true}
  - {id: boom, file: boom.wav, kind: hit, mood: any, claimable: false, approved: true}
  - {id: whoosh, file: whoosh.wav, kind: hit, mood: any, claimable: false, approved: true}
  # CC0 music from OpenGameArt (see CREDITS.md); levelled to -18 LUFS, trimmed to 75s unless it's a short loop
  - {id: sad-emotional-piano-loop, file: sad-emotional-piano-loop.m4a, kind: music, mood: sad, claimable: false, approved: true}
  - {id: funny-quirky-jazz, file: funny-quirky-jazz.m4a, kind: music, mood: funny, claimable: false, approved: true}
  - {id: funny-catch-me-if-you-can, file: funny-catch-me-if-you-can.m4a, kind: music, mood: funny, claimable: false, approved: true}
  - {id: epic-determined-pursuit, file: epic-determined-pursuit.m4a, kind: music, mood: epic, claimable: false, approved: true}
  - {id: epic-trance-trap, file: epic-trance-trap.m4a, kind: music, mood: epic, claimable: false, approved: true}
  - {id: suspense-night-of-the-streets, file: suspense-night-of-the-streets.m4a, kind: music, mood: suspense, claimable: false, approved: true}
  - {id: sneaky-acid-detective, file: sneaky-acid-detective.m4a, kind: music, mood: sneaky, claimable: false, approved: true}
